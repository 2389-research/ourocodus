# Documentation Audit Configuration

# Thresholds for quality metrics
thresholds:
  # Minimum percentage of exported symbols that must have documentation
  doc_coverage_min: 85

  # Fail CI on accuracy drift (code vs docs mismatch)
  drift_fail: true

  # Minimum number of Example tests per major feature
  examples_min: 3

  # Maximum broken links allowed
  broken_links_max: 0

  # Maximum spelling errors allowed
  spelling_errors_max: 5

# Audiences to check documentation completeness for
audiences:
  - user
  - contributor
  - maintainer

# Required documentation by audience
required_docs:
  user:
    - README.md
    - docs/installation.md
    - docs/quickstart.md
    - docs/configuration.md
    - docs/cli.md
  contributor:
    - CONTRIBUTING.md
    - docs/development.md
    - docs/testing.md
  maintainer:
    - SECURITY.md
    - docs/release-process.md
    - docs/architecture.md

# Exclusions - paths to skip during audit
exclusions:
  # Vendor dependencies
  - "vendor/**"
  - "third_party/**"

  # Build artifacts
  - "build/**"
  - "dist/**"
  - "bin/**"

  # Auto-generated code
  - "**/*.pb.go"
  - "**/*_gen.go"
  - "**/*_generated.go"
  - "mocks/**"

  # Common non-docs
  - ".git/**"
  - ".github/**"
  - ".claude/**"
  - "node_modules/**"
  - ".vscode/**"
  - ".idea/**"

# Documentation patterns to discover
doc_patterns:
  - "README.md"
  - "CONTRIBUTING.md"
  - "SECURITY.md"
  - "CODE_OF_CONDUCT.md"
  - "LICENSE"
  - "docs/**/*.md"
  - "doc.go"
  - "**/doc.go"

# Tool configurations
tools:
  # Link checking with lychee
  lychee:
    enabled: true
    timeout: 30
    max_redirects: 5
    accept:
      - 200..299
      - 429  # Too many requests (transient)
    exclude_patterns:
      - "localhost"
      - "127.0.0.1"
      - "example.com"

  # Markdown linting
  markdownlint:
    enabled: true
    config: ".markdownlint.json"
    ignore_patterns:
      - "vendor/"
      - "node_modules/"

  # Spell checking
  codespell:
    enabled: true
    skip_patterns:
      - "*.go"  # Spell check comments separately
      - "go.sum"
      - "go.mod"
      - ".git"
    ignore_words:
      - "ourocodus"
      - "IIFE"
      - "UUIDs"

  # Go doc coverage
  golangci_lint:
    enabled: true
    rules:
      - "revive"
    revive_rules:
      - name: "exported"
        severity: "warning"
      - name: "package-comments"
        severity: "warning"

# Volume heuristics
volume:
  # Maximum lines of docs per function (beyond this = over-documented)
  max_doc_lines_per_function: 20

  # Maximum places same concept explained (beyond this = duplication)
  max_concept_repetitions: 2

  # Minimum explanation for exported functions (chars)
  min_exported_doc_length: 30

# CI integration settings
ci:
  # Run on pull requests
  on_pr: true

  # Fail PR on blockers
  fail_on_blockers: true

  # Warn on completeness gaps
  warn_on_gaps: true

  # Comment summary on PR
  comment_summary: true

  # Schedule for full audits (cron format)
  schedule: "0 0 * * 0"  # Weekly on Sunday at midnight

# Reporting
reporting:
  # Output formats
  formats:
    - markdown
    - json

  # Severity levels to report
  severities:
    - blocker
    - warning
    - suggestion

  # Trend tracking
  track_trends: true
  history_file: "reports/history.json"

# Auto-fix settings
autofix:
  # Enable auto-fix suggestions
  enabled: true

  # Auto-fix types to suggest
  types:
    - broken_links_update
    - spelling_corrections
    - formatting_fixes
    - missing_doc_stubs

  # Apply auto-fixes automatically (DANGEROUS - use with caution)
  auto_apply: false

# Phase 2 settings (deep analysis)
phase2:
  # Enable deep code-driven analysis
  enabled: false  # Set to true when ready for Phase 2

  # Code fact extraction
  extract_code_facts:
    cli_flags: true
    config_keys: true
    exported_apis: true
    env_vars: true
    version_constraints: true

  # Doc claim extraction
  extract_doc_claims:
    cli_reference: true
    config_reference: true
    api_reference: true
    code_examples: true
    compatibility: true

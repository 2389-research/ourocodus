name: Weekly Documentation Audit

on:
  schedule:
    # Every Monday at 9 AM UTC
    - cron: '0 9 * * 1'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Install audit tools
        run: |
          # Link checker
          curl -sL https://github.com/lycheeverse/lychee/releases/download/v0.14.3/lychee-v0.14.3-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv lychee /usr/local/bin/

          # Markdown linter
          npm install -g markdownlint-cli

          # Spell checker
          pip install codespell

      - name: Run Full Documentation Audit
        id: audit
        continue-on-error: true
        run: |
          cd .claude/skills/documentation-audit
          ./scripts/run-quick-checks.sh

      - name: Read audit report
        id: report
        if: always()
        run: |
          if [ -f .claude/skills/documentation-audit/reports/quick-checks-report.md ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if problems found
        if: steps.audit.outcome == 'failure' && steps.report.outputs.report_exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(
              '.claude/skills/documentation-audit/reports/quick-checks-report.md',
              'utf8'
            );

            // Check if issue already exists
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'documentation-audit',
            });

            const existingIssue = issues.find(issue =>
              issue.title.includes('Weekly Documentation Audit')
            );

            const body = `## 📚 Weekly Documentation Audit Report

This is an automated weekly check of documentation quality.

**Generated**: ${new Date().toISOString()}
**Branch**: ${context.ref}
**Commit**: ${context.sha.substring(0, 7)}

---

${report}

---

### Actions Needed

Please review the failed checks and warnings above. Once fixed:
- Comment "resolved" to close this issue
- Or close manually after verification

### Quick Commands

\`\`\`bash
# Test locally
cd .claude/skills/documentation-audit
./scripts/run-quick-checks.sh

# View report
cat reports/quick-checks-report.md
\`\`\`
`;

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## New Audit Run\n\n${body}`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📚 Weekly Documentation Audit Found Issues',
                body: body,
                labels: ['documentation', 'maintenance', 'documentation-audit']
              });
            }

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-audit-report-${{ github.run_number }}
          path: .claude/skills/documentation-audit/reports/
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "### 📚 Documentation Audit Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f .claude/skills/documentation-audit/reports/quick-checks-report.json ]; then
            echo "Results saved to artifacts" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.audit.outcome }}" == "failure" ]; then
            echo "⚠️ Issues found - check the audit report" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
          fi

name: Documentation Audit

on:
  pull_request:
    paths:
      - '**.md'
      - '**.go'
      - 'docs/**'
      - '.claude/skills/documentation-audit/**'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Install lychee (link checker)
        run: |
          curl -sL https://github.com/lycheeverse/lychee/releases/download/v0.14.3/lychee-v0.14.3-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv lychee /usr/local/bin/

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Install codespell
        run: pip install codespell

      - name: Run Documentation Audit
        id: audit
        continue-on-error: true
        run: |
          cd .claude/skills/documentation-audit
          ./scripts/run-quick-checks.sh

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let report;
            try {
              report = fs.readFileSync(
                '.claude/skills/documentation-audit/reports/quick-checks-report.md',
                'utf8'
              );
            } catch (error) {
              report = '⚠️ Could not read audit report';
            }

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📚 Documentation Audit')
            );

            const body = `## 📚 Documentation Audit\n\n${report}`;

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-audit-report
          path: .claude/skills/documentation-audit/reports/
          retention-days: 30

      - name: Fail if blockers found
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Documentation audit found blocking issues"
          exit 1

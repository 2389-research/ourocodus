name: Check Documentation Links

on:
  pull_request:
    paths:
      - '**.md'
  push:
    branches: [main]
    paths:
      - '**.md'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          # Check all markdown files except historical/planning docs
          args: >-
            --verbose
            --no-progress
            --accept 200,403,429,404
            --exclude 'localhost'
            --exclude-path 'docs/history'
            --exclude-path 'docs/implementation'
            --exclude-path 'docs/testing'
            --exclude-path 'docs/ACP.md'
            --exclude-path 'docs/ARCHITECTURE.md'
            --exclude-path 'docs/NATS.md'
            --exclude-path 'docs/PROTOCOLS.md'
            --exclude-path 'docs/SECURITY.md'
            --exclude-path 'docs/SESSION_LIFECYCLE.md'
            --exclude-path 'docs/ERROR_HANDLING.md'
            --exclude-path 'docs/TESTING.md'
            --exclude-path 'docs/ROADMAP.md'
            --exclude-path 'docs/ISSUES.md'
            --exclude-path 'docs/ASSUMPTIONS.md'
            --exclude-path 'docs/CONTAINERIZED_ACP.md'
            --exclude-path 'docs/AGENT_RUNTIME.md'
            '**/*.md'
          # Fail the build if broken links are found
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: Broken documentation links detected
          content-filepath: ./lychee/out.md
          labels: documentation, bug

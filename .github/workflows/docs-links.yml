name: Check Documentation Links

on:
  pull_request:
    paths:
      - '**.md'
  push:
    branches: [main]
    paths:
      - '**.md'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v1
        with:
          # Check all markdown files except historical docs and localhost URLs
          args: --verbose --no-progress --accept 200,403,429 --exclude 'localhost' --exclude-path 'docs/history/**' '**/*.md'
          # Fail the build if broken links are found
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: Broken documentation links detected
          content-filepath: ./lychee/out.md
          labels: documentation, bug

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - revive
    - gocyclo
    - misspell
    - unparam
    - unconvert
    - gosec

linters-settings:
  gocyclo:
    min-complexity: 15
  govet:
    enable-all: true
    disable:
      - fieldalignment # Disable struct field alignment checks (micro-optimization for POC)
      - shadow # Disable shadow variable checks (common Go pattern in error handling)
  revive:
    severity: warning
  gosec:
    excludes:
      - G104 # Audit errors not checked (we'll handle this properly later)

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  # Exclude some linters from running on tests
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
        - unparam # Test helper functions may have unused return values

    # Temporary exception for TerminateUserSession complexity
    # TODO: Refactor in future to reduce complexity (issue #166, #167, #168)
    - path: pkg/relay/session/manager\.go
      text: "cyclomatic complexity.*TerminateUserSession"
      linters:
        - gocyclo

    # Temporary exception for initializeAgentInfrastructure complexity
    # Function performs sequential initialization with error handling for each component
    - path: cmd/relay/main\.go
      text: "cyclomatic complexity.*initializeAgentInfrastructure"
      linters:
        - gocyclo

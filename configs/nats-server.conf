# NATS Server Configuration for Ourocodus
# Documentation: https://docs.nats.io/running-a-nats-service/configuration

# Server identity
server_name: ourocodus-nats

# Network settings
port: 4222
http_port: 8222

# Monitoring and metrics
# HTTP monitoring available at http://localhost:8222/varz
# Prometheus-style metrics available at http://localhost:8222/metrics (requires NATS 2.10+)
http: 8222
server_tags: [
    "env:development",
    "project:ourocodus"
]

# JetStream configuration
jetstream {
    # Store directory for persistence
    store_dir: "/data"

    # Memory and storage limits for development
    max_memory_store: 1GB
    max_file_store: 10GB
}

# Logging configuration
debug: false
trace: false
logtime: true
log_file: "/data/nats-server.log"

# Connection limits
max_connections: 1000
max_control_line: 4096
max_payload: 8388608    # 8MB max message size

# Write deadline for slow consumers
write_deadline: "10s"

# Note: JetStream streams (SESSION_EVENTS, WORK_RESULTS) are created
# by the nats-init container using the NATS CLI. See scripts/nats-init.sh

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Inspector - Ourocodus PWA</title>
    <link rel="stylesheet" href="/inspector.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <iframe id="pwa-frame" src="/?inspector=true" title="PWA Interface"></iframe>
        </div>
        <div class="right-panel">
            <div class="message-stream">
                <h2>Message Stream</h2>
                <div class="inspector-controls" role="toolbar" aria-label="Protocol inspector controls">
                    <input
                        type="text"
                        id="inspectorSearch"
                        class="inspector-search"
                        placeholder="Search messages..."
                        aria-label="Search protocol messages"
                    >
                    <div class="inspector-buttons">
                        <button id="inspectorExport" class="btn btn-small" aria-label="Export messages as JSON">
                            Export JSON
                        </button>
                        <button id="inspectorClear" class="btn btn-small btn-danger" aria-label="Clear all messages">
                            Clear
                        </button>
                    </div>
                </div>
                <div id="message-list" class="inspector-messages"></div>
            </div>
            <div class="connection-state">
                <h2>Connection</h2>
                <div id="state-indicator" class="state-disconnected">Connection: disconnected</div>
            </div>
            <div class="session-info">
                <div id="session-panel">
                    <h3>Session</h3>
                    <div>No session</div>
                </div>
            </div>
        </div>
    </div>
    <script src="/protocol-inspector.js"></script>
</body>
</html>
